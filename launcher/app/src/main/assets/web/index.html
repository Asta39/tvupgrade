<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Home for TV</title>
<style>
  /* The look follows couch-tv's phone remote (github.com/Seagey/couch-tv, remote/src/styles.css, MIT): one glass
     material over a blurred picture, round glass controls, a floating pill to move between pages. */
  :root {
    color-scheme: dark;
    --ink: #fff; --ink-2: rgba(255,255,255,.74); --ink-3: rgba(255,255,255,.58);
    --glass: rgba(255,255,255,.13); --glass-press: rgba(255,255,255,.24); --rim: rgba(255,255,255,.17);
    --sheet: rgba(30,30,34,.55); --sep: rgba(255,255,255,.12);
    --blue: #0a84ff; --green: #30d158; --red: #ff6961; --orange: #ff9f0a;
    --gap: 12px; --side: 18px; --ctl: 56px; --ask-h: 58px; --nav-h: 60px;
    --ease: cubic-bezier(.22,1,.36,1);
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --font: -apple-system, "SF Pro Text", system-ui, Inter, Roboto, "Helvetica Neue", sans-serif;
    --font-d: -apple-system, "SF Pro Display", system-ui, Inter, Roboto, "Helvetica Neue", sans-serif;
  }
  @media (max-height: 740px) { :root { --gap: 10px; --ctl: 52px; --ask-h: 54px; --nav-h: 56px; } }
  @media (max-height: 640px) { :root { --gap: 8px; --ctl: 48px; --ask-h: 50px; } }
  @media (max-width: 360px) { :root { --side: 14px; --ctl: 50px; } }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #050506; }
  body { color: var(--ink); font: 400 16px/1.35 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid rgba(255,255,255,.85); outline-offset: 2px; }

  /* backdrop: the TV's picture (or what's playing), blurred */
  .backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: #050506; }
  .bd-layer { position: absolute; inset: -80px; background-size: cover; background-position: center;
    filter: blur(48px) saturate(1.5) brightness(.55); opacity: 0; transition: opacity .9s var(--ease); }
  .bd-layer.on { opacity: 1; }
  .bd-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.05) 30%, rgba(0,0,0,.45)); }

  /* the one material */
  .glass { background: var(--glass); border: 1px solid var(--rim);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 6px 20px rgba(0,0,0,.22);
    -webkit-backdrop-filter: blur(28px) saturate(1.7); backdrop-filter: blur(28px) saturate(1.7); }
  button.glass:active, .round:active { background: var(--glass-press); }
  .solid { background: #fff; color: #0b0b0d; }
  button.solid:active { background: #d9d9de; }

  main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto;
    padding: calc(var(--sat) + 14px) var(--side) calc(var(--sab) + var(--nav-h) + 34px); min-height: 100%; }
  main.fit { height: 100dvh; min-height: 0; display: flex; flex-direction: column; gap: var(--gap);
    padding-bottom: calc(var(--sab) + var(--nav-h) + 26px); }

  h1 { font: 700 clamp(28px, 8.5vw, 34px)/1.1 var(--font-d); letter-spacing: -.02em; margin: 6px 0 4px; text-wrap: balance; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--ink-3); text-transform: uppercase; }
  .sub { color: var(--ink-2); font-size: 15px; }
  .section { margin-top: 22px; }
  .section > .eyebrow { display: block; padding: 0 4px 8px; }
  .note { font-size: 13px; color: var(--ink-3); padding: 8px 4px 0; line-height: 1.4; }
  .muted { color: var(--ink-3); }
  .err { color: var(--red); font-size: 14px; min-height: 20px; padding: 8px 4px 0; }

  /* grouped lists on glass */
  .list { border-radius: 20px; padding: 0 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--sep); }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--ink-2); }
  .row .v { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
  .row input:not([type=checkbox]) { border: 0; background: none; outline: none; text-align: right; min-width: 0; flex: 1 1 auto; }
  .row input::placeholder { color: var(--ink-3); }
  .row input[type=date], .row input[type=time] { flex: 0 0 auto; background: rgba(255,255,255,.12); border-radius: 8px; padding: 6px 10px; color-scheme: dark; }
  .two-line { display: flex; flex-direction: column; text-align: left; min-width: 0; }
  .two-line small { font-size: 13px; color: var(--ink-3); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 18px; }
  .tile { border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .tile .label { font-size: 13px; color: var(--ink-2); }
  .tile .big { font: 700 28px var(--font-d); }

  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border-radius: 999px; min-height: var(--ask-h);
    font-weight: 600; font-size: 17px; text-decoration: none; }
  .btn.red { color: var(--red); }
  .link { color: #64b5ff; font-weight: 600; font-size: 15px; padding: 6px 0; min-height: 36px; }
  .pill { background: #fff; color: #000; font-weight: 600; font-size: 15px; padding: 8px 16px; border-radius: 999px; min-height: 36px; }
  .status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--green); }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .status.off { color: var(--ink-3); } .status.off i { background: var(--ink-3); }
  .seg { display: flex; padding: 3px; border-radius: 22px; }
  .seg button { flex: 1 1 0; height: 38px; padding: 0 10px; border-radius: 19px; font-weight: 600; font-size: 15px; color: var(--ink-2);
    transition: background .2s var(--ease), color .2s; white-space: nowrap; }
  .seg button.on { background: rgba(255,255,255,.26); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
  .switch { position: relative; width: 51px; height: 31px; flex: 0 0 auto; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; }
  .switch i { position: absolute; inset: 0; background: rgba(120,120,128,.36); border-radius: 31px; transition: .2s; pointer-events: none; }
  .switch i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: .2s var(--ease); }
  .switch input:checked + i { background: var(--green); }
  .switch input:checked + i::after { transform: translateX(20px); }
  .icon { width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto; background: rgba(255,255,255,.12); object-fit: cover; }

  /* floating pill navigation, like iOS */
  nav.dock { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 12px);
    display: flex; gap: 2px; padding: 4px; border-radius: 999px; width: min(420px, calc(100% - 2 * var(--side))); }
  /* iOS tab style: icon over a small label, every tab the same share of the pill, so it never overflows */
  nav.dock button { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    height: calc(var(--nav-h) - 8px); padding: 0 4px; border-radius: 999px; color: var(--ink-2); font-weight: 600; font-size: 11px;
    white-space: nowrap; transition: background .25s var(--ease), color .2s; }
  nav.dock button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  nav.dock button.on { background: rgba(255,255,255,.24); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }

  /* sticky actions sit above the pill, never behind it */
  .actions { position: fixed; z-index: 5; left: 0; right: 0; bottom: calc(var(--sab) + var(--nav-h) + 26px); padding: 0 var(--side); }
  .actions > div { max-width: 560px; margin: 0 auto; }
  main.has-actions { padding-bottom: calc(var(--sab) + var(--nav-h) + var(--ask-h) + 48px); }

  /* remote */
  .now { border-radius: 24px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; flex: 0 0 auto; }
  [hidden] { display: none !important; }
  .now-head { display: flex; align-items: center; gap: 14px; }
  .now-art { flex: none; width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: rgba(255,255,255,.1); box-shadow: 0 8px 22px rgba(0,0,0,.4); }
  .now-title { font: 700 19px/1.2 var(--font-d); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .now-sub { color: var(--ink-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); overflow: hidden; }
  .bar i { display: block; height: 100%; background: rgba(255,255,255,.92); border-radius: 3px; }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-top: -4px; }
  .row-ctl { display: flex; justify-content: space-between; gap: var(--gap); flex: 0 0 auto; }
  .round { width: var(--ctl); height: var(--ctl); border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; }
  .pad { position: relative; flex: 1 1 auto; min-height: 170px; border-radius: 32px; display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  .pad .chev { position: absolute; opacity: .38; transition: opacity .35s, transform .35s var(--ease); }
  .pad .chev.up { top: 14px; } .pad .chev.down { bottom: 14px; } .pad .chev.left { left: 14px; } .pad .chev.right { right: 14px; }
  .pad .chev.lit { opacity: 1; transition: none; }
  .pad .ring { width: 88px; height: 88px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.24); transition: background .35s, transform .35s var(--ease); }
  .pad .ring.lit { background: rgba(255,255,255,.16); transform: scale(.94); transition: none; }
  .pad .hint { position: absolute; top: calc(50% + 58px); font-size: 13px; color: var(--ink-3); pointer-events: none; }
  @media (max-height: 640px) { .pad .hint { display: none; } }
  .volume { flex: 1 1 auto; display: flex; align-items: center; justify-content: space-between; border-radius: 999px; height: var(--ctl); padding: 0 6px; min-width: 0; }
  .volume button { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; }
  .volume button:active { background: var(--glass-press); }
  .ask-btn { flex: 0 0 auto; }

  /* watch */
  .field { display: flex; align-items: center; gap: 10px; border-radius: 999px; padding: 0 16px; min-height: 50px; }
  .field input { flex: 1 1 auto; border: 0; background: none; outline: none; min-width: 0; font-size: 17px; }
  .field input::placeholder { color: var(--ink-3); }
  .results { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .title { display: flex; gap: 12px; border-radius: 20px; padding: 10px; }
  .poster { width: 64px; aspect-ratio: 2/3; border-radius: 10px; object-fit: cover; background: rgba(255,255,255,.1); flex: 0 0 auto; }
  .tinfo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tinfo small { color: var(--ink-3); font-size: 13px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { background: rgba(255,255,255,.16); font-size: 14px; font-weight: 600; border-radius: 999px; padding: 8px 14px; min-height: 36px; }
  .chips button:active { background: var(--glass-press); }
  .chips button.on { background: var(--blue); }
  .apps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 10px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); min-width: 0; }
  .app img { width: 100%; max-width: 72px; aspect-ratio: 1; border-radius: 22%; object-fit: cover; box-shadow: 0 6px 18px rgba(0,0,0,.35); background: rgba(255,255,255,.1); }
  .app span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shelf { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; margin: 0 calc(-1 * var(--side)); padding-left: var(--side); padding-right: var(--side); scrollbar-width: none; scroll-padding-inline: var(--side); }
  .shelf::-webkit-scrollbar { display: none; }
  .shelf .pick { flex: 0 0 auto; width: 118px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .shelf .pick img { width: 100%; aspect-ratio: 2/3; border-radius: 14px; object-fit: cover; box-shadow: 0 8px 22px rgba(0,0,0,.4); }
  .shelf .pick b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shelf .pick small { font-size: 12px; color: var(--ink-3); }

  /* the swipe deck */
  .deck { position: relative; height: clamp(340px, calc(100dvh - 330px), 560px); margin-top: 12px; touch-action: pan-y; }
  .card { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; background: #111 center/cover no-repeat;
    box-shadow: 0 18px 40px rgba(0,0,0,.45); will-change: transform; user-select: none; -webkit-user-select: none;
    transition: transform .35s var(--ease), opacity .35s; touch-action: pan-y; }
  .card.drag { transition: none; }
  .card .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.85)); }
  .card .meta { position: absolute; left: 18px; right: 18px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
  .card .meta b { font: 700 24px/1.15 var(--font-d); text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .card .meta small { color: var(--ink-2); font-size: 14px; }
  .card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .card .tags span { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.18);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .stamp { position: absolute; top: 22px; padding: 6px 14px; border-radius: 10px; font: 800 24px var(--font-d); letter-spacing: .06em;
    border: 3px solid; opacity: 0; transform: rotate(-12deg); }
  .stamp.like { left: 18px; color: var(--green); }
  .stamp.nope { right: 18px; color: var(--red); transform: rotate(12deg); }
  .deck-ctl { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 14px; }
  .deck-ctl .round { width: 58px; height: 58px; }
  .deck-ctl .round.big { width: 68px; height: 68px; }
  .deck-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-3); padding: 24px; border-radius: 26px; }

  .code { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .code input { height: 56px; border-radius: 14px; text-align: center; font: 600 26px var(--font-d); outline: none; min-width: 0; border: 1px solid var(--rim); background: var(--glass); }
  .code input:focus { border-color: var(--blue); }
  .center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .appicon { width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; }
  .stay-card { border-radius: 24px; padding: 18px; margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
  .mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .mini div { background: rgba(255,255,255,.1); border-radius: 14px; padding: 10px 12px; min-width: 0; }
  .mini small { display: block; font-size: 12px; color: var(--ink-3); }
  .mini b { font-size: 18px; }
  .rule-x { width: 22px; height: 22px; border-radius: 50%; background: var(--red); color: #fff; font-weight: 700; line-height: 1; flex: 0 0 auto; }
  .move { color: var(--ink-3); padding: 4px; min-width: 32px; min-height: 32px; }
  .answer { font-size: 16px; line-height: 1.45; white-space: pre-wrap; padding: 4px 2px; }
  .scrim { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .25s; }
  .scrim.on { opacity: 1; }
  .sheet { position: fixed; z-index: 9; left: 50%; bottom: calc(var(--sab) + 12px); width: min(540px, calc(100% - 24px));
    transform: translate(-50%, 110%); transition: transform .35s var(--ease); border-radius: 28px; padding: 18px 16px 14px;
    background: rgba(40,40,46,.72); }
  .sheet.on { transform: translate(-50%, 0); }
  .sheet h2 { font: 700 20px var(--font-d); padding: 0 4px; }
  .sheet .where { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 10px; }
  .sheet .where button { display: flex; align-items: center; justify-content: space-between; min-height: 54px; padding: 0 18px;
    border-radius: 16px; background: rgba(255,255,255,.12); font-weight: 600; font-size: 17px; }
  .sheet .where button:active { background: var(--glass-press); }
  .sheet .where small { color: var(--ink-3); font-weight: 500; font-size: 14px; }
  .sheet p { color: var(--ink-2); font-size: 15px; padding: 8px 4px 0; line-height: 1.4; }
  .sheet .btn { margin-top: 10px; }
  .remind { border-radius: 20px; padding: 14px 16px; margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .remind.urgent { border-color: rgba(255,159,10,.6); }
  .remind b { font-size: 16px; }
  .remind span { color: var(--ink-2); font-size: 14px; }
  .acct-btn { font-size: 14px; font-weight: 600; border-radius: 999px; padding: 8px 14px; min-height: 36px; background: #fff; color: #000; flex: 0 0 auto; }
  .acct-btn.out { background: rgba(255,105,97,.2); color: var(--red); }
  /* the guest's home dashboard */
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .grid2:empty { display: none; }
  .grid2 .tonight, .grid2 .suntile { grid-column: 1 / -1; }
  .suntile { gap: 2px; }
  .sunhead { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--ink-3); }
  .suntime { font: 600 34px/1.15 var(--font-d); letter-spacing: -.01em; margin-top: 4px; }
  .suncurve { width: 100%; height: 64px; margin: 6px 0 4px; overflow: visible; }
  .sunfoot { font-size: 14px; font-weight: 500; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .media { display: flex; align-items: center; gap: 14px; border-radius: 22px; padding: 10px 14px 10px 10px; }
  .mposter { width: 56px; aspect-ratio: 2/3; border-radius: 10px; object-fit: cover; background: rgba(255,255,255,.1); flex: 0 0 auto; }
  .mart { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: rgba(255,255,255,.1); flex: 0 0 auto; }
  .mtitle { font: 700 18px/1.2 var(--font-d); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .media .eyebrow { font-size: 11px; }
  .wcard { border-radius: 22px; padding: 16px; margin-top: 12px; }
  .wnow { display: flex; justify-content: space-between; align-items: flex-start; }
  .wtemp { font: 700 44px/1 var(--font-d); margin-top: 4px; }
  .whours { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--sep); text-align: center; }
  .whours div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .whours small { font-size: 12px; color: var(--ink-3); }
  .whours span { font-size: 20px; }
  .whours i { font-style: normal; font-size: 11px; color: #64b5ff; min-height: 14px; }
  .tline { font-size: 15px; line-height: 1.35; }
  /* watch together and music */
  .together { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border-radius: 22px; padding: 14px 16px; margin-top: 18px; }
  .together svg { flex: 0 0 auto; color: #ff6b8a; }
  .together small { line-height: 1.35; }
  .members { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .member { display: inline-flex; align-items: baseline; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 14px; }
  .member small { color: var(--ink-3); font-size: 12px; }
  .member.you { background: rgba(255,255,255,.24); }
  .sheet.match { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sheet.match img { width: 128px; aspect-ratio: 2/3; border-radius: 14px; object-fit: cover; box-shadow: 0 14px 34px rgba(0,0,0,.5); margin: -54px 0 8px;
    animation: pop .6s var(--ease); }
  .sheet.match h2 { font-size: 24px; }
  .sheet.match .btn { margin-top: 8px; }
  @keyframes pop { from { transform: scale(.6) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .toast { position: fixed; left: 50%; top: calc(var(--sat) + 14px); transform: translate(-50%, -20px); background: #fff; color: #000; z-index: 9;
    padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; opacity: 0; transition: .25s var(--ease); pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .card, .bd-layer, .seg button, nav.dock button { transition: none; } }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><div class="bd-layer" id="bd1"></div><div class="bd-layer" id="bd2"></div><div class="bd-shade"></div></div>
<div class="toast" id="toast" role="status"></div>
<main id="app"><p class="muted">Loading…</p></main>
<div class="actions" id="actions" hidden><div></div></div>
<nav class="dock glass" id="dock" hidden aria-label="Pages"></nav>
<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let session = localStorage.getItem('tvhome-session') || '';
let state = {}, host = null, apps = [], page = '', hostTab = 'today', nowTimer = 0;
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  remote: '<rect x="7" y="2" width="10" height="20" rx="5"/><circle cx="12" cy="8" r="2"/>',
  watch: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  guide: '<path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 9h6M8 13h6"/>',
  host: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  lock: '<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  wifi: '<path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/>',
  back: '<path d="M15 6l-6 6 6 6"/>', tv: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  chev: '<path d="M6 15l6-6 6 6"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', heart: '<path d="M12 21s-7-4.4-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.6 12 21 12 21z"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>', play: '<path d="M7 4l13 8-13 8z"/>',
  prev: '<path d="M18 6L8 12l10 6z"/><path d="M6 6v12"/>', next: '<path d="M6 6l10 6-10 6z"/><path d="M18 6v12"/>',
  r10: '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/>', f10: '<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v4h-4"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.8"/><path d="M16 14.2a5.5 5.5 0 0 1 6 5.8"/>',
};
const svg = (n, size = 22, w = 1.9, fill = 'none') => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 1800); }
// A tick under the finger. iPhone Safari has no vibrate API; since iOS 18 toggling a hidden switch through its label
// plays the system tick (couch-tv's haptics.js trick). Only inside a touch or click.
let hapticLabel;
function tick() {
  if (navigator.vibrate) { navigator.vibrate(8); return; }
  if (!hapticLabel) {
    const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); i.id = 'haptic'; i.tabIndex = -1;
    hapticLabel = document.createElement('label'); hapticLabel.htmlFor = 'haptic';
    for (const el of [i, hapticLabel]) { el.setAttribute('aria-hidden', 'true'); Object.assign(el.style, { position: 'fixed', left: '-9999px', opacity: '0', pointerEvents: 'none' }); }
    document.body.append(i, hapticLabel);
  }
  hapticLabel.click();
}
async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'X-Session': session },
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}
let bdTop = 1, bdUrl = '';
function backdrop(url) {
  if (!url || url === bdUrl) return;
  const img = new Image();
  img.onload = () => { bdUrl = url; const next = $('#bd' + (bdTop === 1 ? 2 : 1)), cur = $('#bd' + bdTop);
    next.style.backgroundImage = `url("${url}")`; next.classList.add('on'); cur.classList.remove('on'); bdTop = bdTop === 1 ? 2 : 1; };
  img.src = url;
}
function actions(html) { const a = $('#actions'); a.hidden = !html; a.firstElementChild.innerHTML = html || ''; app.classList.toggle('has-actions', !!html); }
function dock(list) {
  const d = $('#dock');
  if (!list) { d.hidden = true; return; }
  d.hidden = false; d.classList.toggle('many', list.length > 3);
  d.innerHTML = list.map(([id, label, icon]) => `<button class="${id === page ? 'on' : ''}" data-page="${id}" aria-current="${id === page ? 'page' : 'false'}">${svg(icon, 20)}<span>${label}</span></button>`).join('');
  d.querySelectorAll('[data-page]').forEach(b => b.onclick = () => { tick(); go(b.dataset.page); });
}
const GUEST_PAGES = [['home', 'Home', 'home'], ['remote', 'Remote', 'remote'], ['watch', 'Watch', 'watch'], ['party', 'Music', 'music'], ['guide', 'Guide', 'guide']];
const HOST_PAGES = [['remote', 'Remote', 'remote'], ['watch', 'Watch', 'watch'], ['party', 'Music', 'music'], ['host', 'Host', 'host']];
// Music shows whenever the TV has a player for it (Bitchord, TizenTube or YouTube). "together" is a page inside Watch.
const pagesFor = () => (state.host ? HOST_PAGES : GUEST_PAGES).filter(p => p[0] !== 'party' || state.music);
// This phone, for the shared group and queue: a random id and the name the others see.
const phoneId = (() => { try { let i = localStorage.getItem('tvhome-phone'); if (!i) { i = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('tvhome-phone', i); } return i; } catch (e) { return 'p' + Math.random(); } })();
function myName(ask) {
  let n = ''; try { n = localStorage.getItem('tvhome-name') || ''; } catch (e) {}
  if (!n && ask) { n = (prompt('Your first name, so the others know who picked what:') || '').trim().slice(0, 24); try { if (n) localStorage.setItem('tvhome-name', n); } catch (e) {} }
  return n;
}

async function load() {
  backdrop('/api/backdrop');
  try { state = await api('/api/state'); }
  catch (e) {
    dock(null); actions(null);
    app.className = '';
    app.innerHTML = `<div class="center" style="margin-top:80px"><div class="appicon glass">${svg('wifi', 34)}</div>
      <h1>Can’t reach the TV</h1><p class="sub">This page only works on the same Wi-Fi as the TV. Turn off mobile data, join the Wi-Fi shown on the TV, then reload.</p>
      <button class="btn solid" onclick="location.reload()" style="margin-top:12px">Try again</button></div>`;
    return;
  }
  if (state.build) build = build || state.build;
  if (!state.claimed) return claimView();
  const pages = pagesFor();
  if (page !== 'together' && !pages.some(p => p[0] === page)) page = state.host ? 'remote' : 'home';
  render();
}
// A phone tab can stay open for days. When the TV has a newer page than this one, reload into it.
let build = 0;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) return;
  try { const s = await api('/api/state'); if (build && s.build && s.build !== build) location.reload(); } catch (e) {}
});
function go(p) { page = p; window.scrollTo(0, 0); render(); }
function render() {
  clearInterval(nowTimer); actions(null); app.className = '';
  dock(pagesFor());
  if (page === 'remote') return remoteView();
  if (page === 'watch') return watchView();
  if (page === 'together') return togetherView();
  if (page === 'party') return partyView();
  if (page === 'guide') return guideView();
  if (page === 'host') return hostView();
  homeView();
}

// ---- claim and sign-in ---------------------------------------------------------------------------------
function claimView() {
  dock(null);
  const code = ((location.hash.match(/claim=(\d{6})/) || [])[1] || '').split('');
  app.className = 'has-actions';
  app.innerHTML = `
    <div class="center" style="margin-top:24px"><div class="appicon glass">${svg('tv', 38, 1.6)}</div>
      <h1>Set up this TV</h1><p class="sub" style="max-width:300px">You’ll be the host. Guests never see this page or your settings.</p></div>
    <div class="section"><label class="eyebrow" for="c0">Code shown on the TV</label>
      <div class="code">${[0,1,2,3,4,5].map(i => `<input id="c${i}" inputmode="numeric" maxlength="1" aria-label="Digit ${i + 1}" value="${esc(code[i] || '')}">`).join('')}</div>
      ${code.length === 6 ? `<div class="note" style="color:var(--green)">Filled in from the QR code</div>` : ''}</div>
    <div class="section"><span class="eyebrow">Choose a host PIN</span><div class="list glass">
      <label class="row"><span>PIN</span><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="4 to 8 digits"></label>
      <label class="row"><span>Confirm</span><input id="pin2" type="password" inputmode="numeric" maxlength="8" placeholder="Same PIN again"></label></div>
      <div class="note">You’ll use it to sign in here and to leave Guest or Kids mode on the TV.</div></div>
    <p class="err" id="err"></p>`;
  $('#actions').style.bottom = 'calc(var(--sab) + 20px)';
  actions(`<button class="btn solid" id="go">Become the host</button>`);
  const boxes = [...document.querySelectorAll('.code input')];
  boxes.forEach((b, i) => {
    b.oninput = () => { b.value = b.value.replace(/\D/g, '').slice(-1); if (b.value && boxes[i + 1]) boxes[i + 1].focus(); };
    b.onkeydown = e => { if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus(); };
    b.onpaste = e => { const d = (e.clipboardData.getData('text').match(/\d/g) || []).slice(0, 6); if (d.length) { e.preventDefault(); d.forEach((x, k) => boxes[k] && (boxes[k].value = x)); } };
  });
  $('#go').onclick = async () => {
    const pin = $('#pin').value.trim();
    if (pin !== $('#pin2').value.trim()) return $('#err').textContent = 'The two PINs don’t match.';
    try {
      const r = await api('/api/claim', { code: boxes.map(b => b.value).join(''), pin });
      session = r.session; localStorage.setItem('tvhome-session', session);
      history.replaceState(null, '', '/'); toast('You’re the host'); $('#actions').style.bottom = ''; page = 'host'; load();
    } catch (e) { $('#err').textContent = e.message; }
  };
}
function signIn() {
  dock(null);
  app.className = 'has-actions';
  app.innerHTML = `<div class="center" style="margin-top:40px"><div class="appicon glass">${svg('lock', 34, 1.6)}</div>
    <h1>Host sign-in</h1><p class="sub">Enter your host PIN.</p></div>
    <div class="section"><div class="list glass"><label class="row"><span>PIN</span><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="Your PIN" autofocus></label></div></div>
    <p class="err" id="err"></p><p style="text-align:center;margin-top:8px"><button class="link" id="cancel">Cancel</button></p>`;
  $('#actions').style.bottom = 'calc(var(--sab) + 20px)';
  actions(`<button class="btn solid" id="go">Sign in</button>`);
  $('#go').onclick = async () => {
    try { const r = await api('/api/login', { pin: $('#pin').value.trim() }); session = r.session; localStorage.setItem('tvhome-session', session);
      $('#actions').style.bottom = ''; page = 'host'; load(); }
    catch (e) { $('#err').textContent = e.message; }
  };
  $('#cancel').onclick = () => { $('#actions').style.bottom = ''; load(); };
}

// ---- guest pages ---------------------------------------------------------------------------------------
// ---- home: the guest's dashboard ---------------------------------------------------------------------------
// The stay comes with the page's state; the rest (weather by the hour, the sun, tonight's plan, what's popular on
// the TV, what to resume, the room's music) from /api/dashboard, filled in when it arrives and every minute.
let dash = null;
function homeView() {
  const s = state;
  const hello = s.staying && s.names ? `${greeting()}, ${esc(s.names)}` : (s.place ? `Welcome to ${esc(s.place)}` : 'Welcome');
  const line = s.staying ? (s.arriving ? `Check-in from ${esc(s.checkin)}. Make yourselves at home.`
    : s.leaving ? `Check-out today by ${esc(s.checkout)}. Safe travels.`
    : `Night ${s.night} of ${s.nights} · check-out ${esc(s.checkout_day)} ${esc(s.checkout)}`) : esc(s.about);
  app.innerHTML = `
    ${s.place ? `<span class="eyebrow">${esc(s.place)}</span>` : ''}
    <h1>${hello}</h1><p class="sub">${line}</p>
    ${signedReminder()}
    <div id="dtoday"></div>
    <div class="grid2">
      ${s.staying ? stayTile() : ''}
      ${s.door_code ? `<div class="tile glass">${svg('lock', 22)}<span class="label">Door code</span><span class="big" style="letter-spacing:.08em">${esc(s.door_code)}</span></div>` : ''}
    </div>
    <div id="dweather"></div>
    <div class="section"><span class="eyebrow">Around you</span>
      ${s.wifi_name ? `<div class="list glass">
        <div class="row" style="justify-content:flex-start">${svg('wifi', 22)}<div class="two-line" style="flex:1 1 auto"><small>Wi-Fi</small><b>${esc(s.wifi_name)}</b>${s.wifi_password ? `<small>${esc(s.wifi_password)}</small>` : ''}</div>
          ${s.wifi_password ? `<button class="pill" id="copy">Copy</button>` : ''}</div></div>` : ''}
      <div class="grid2" id="daround"></div></div>
    <div id="dpopular"></div>
    ${s.apps.length ? `<div class="section"><span class="eyebrow">Open on the TV</span><div class="apps">
      ${s.apps.map(a => `<button class="app" data-app="${esc(a.pkg)}"><img src="/api/icon?pkg=${encodeURIComponent(a.pkg)}" alt=""><span>${esc(a.label)}</span></button>`).join('')}</div></div>` : ''}
    <p style="text-align:center;margin-top:26px"><button class="link" id="hostin">Host sign-in</button></p>`;
  bindSignOutAll();
  if ($('#copy')) $('#copy').onclick = () => copy(s.wifi_password);
  $('#hostin').onclick = signIn;
  document.querySelectorAll('[data-app]').forEach(b => b.onclick = () => { tick(); api('/api/remote', { app: b.dataset.app }).then(() => toast('Opening on the TV…')).catch(e => toast(e.message)); });
  if (dash) fillDash();
  const refresh = async () => { try { dash = await api('/api/dashboard'); if (page === 'home') fillDash(); } catch (e) {} };
  refresh(); nowTimer = setInterval(refresh, 60000);
}
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
// The stay, or on the last day a countdown to check-out.
function stayTile() {
  const s = state;
  if (s.leaving) {
    const [hh, mm] = (s.checkout_time || '').split(':').map(Number);
    const out = new Date(); out.setHours(isNaN(hh) ? 10 : hh, isNaN(mm) ? 0 : mm, 0, 0);
    const m = Math.round((out - Date.now()) / 60000);
    return `<div class="tile glass">${svg('home', 22)}<span class="label">Check-out</span><span class="big">${m <= 0 ? 'Now' : m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : m + ' min'}</span></div>`;
  }
  return `<div class="tile glass">${svg('home', 22)}<span class="label">${s.arriving ? 'Arriving today' : 'Your stay'}</span><span class="big">${s.arriving ? 'Night 1' : `Night ${s.night}<small class="muted" style="font-size:16px"> of ${s.nights}</small>`}</span></div>`;
}
// Sunrise and sunset, after Apple Weather's tile: a small symbol and label, the next of the two in large type, the
// day as one smooth curve over 24 hours (bright above the horizon, dim below it) with the sun where it is now, and
// the other time underneath.
function sunTile(w) {
  const now = Date.now(), up = new Date(w.sunrise[0]).getTime(), down = new Date(w.sunset[0]).getTime();
  const isDay = now > up && now < down;
  let next = isDay ? down : (now < up ? up : new Date(w.sunrise[1] || w.sunrise[0]).getTime());
  while (next < now) next += 86400000; // after tonight's sunset with no later sunrise listed: same time tomorrow
  const other = isDay ? (now < up ? down : up) : down;
  // The curve: hours of the day across, a cosine peaking at solar noon; the horizon crosses it at sunrise and sunset.
  const hour = t => { const d = new Date(t); return d.getHours() + d.getMinutes() / 60; };
  const rise = hour(up), set = hour(down), noon = (rise + set) / 2;
  const W = 300, H = 72, mid = 40, A = 26;
  const y = h => mid - A * Math.cos(2 * Math.PI * (h - noon) / 24);
  const horizon = y(rise);
  let path = '';
  for (let i = 0; i <= 96; i++) { const h = i / 4; path += (i ? 'L' : 'M') + (h / 24 * W).toFixed(1) + ' ' + y(h).toFixed(1); }
  const nowH = hour(now), sx = nowH / 24 * W, sy = y(nowH);
  const mins = Math.round((next - now) / 60000);
  // Like SF Symbols' sunrise.fill / sunset.fill: a filled half sun on the horizon, an arrow up or down above it.
  const arrow = isDay ? '<path d="M12 3.5v6M9.4 7 12 9.6 14.6 7"/>' : '<path d="M12 9.6v-6M9.4 6.1 12 3.5l2.6 2.6"/>';
  const icon = `<path d="M6.5 18.5a5.5 5.5 0 0 1 11 0z" fill="currentColor" stroke="none"/><path d="M3 18.5h18"/>${arrow}
    <path d="M3.6 14.2l1.6.9M20.4 14.2l-1.6.9"/>`;
  return `<div class="tile glass suntile">
    <span class="sunhead"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon}</svg>${isDay ? 'SUNSET' : 'SUNRISE'}</span>
    <span class="suntime">${clock(next)}</span>
    <svg class="suncurve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <clipPath id="sky"><rect x="0" y="0" width="${W}" height="${horizon}"/></clipPath>
        <clipPath id="ground"><rect x="0" y="${horizon}" width="${W}" height="${H - horizon}"/></clipPath>
        <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      </defs>
      <path d="${path}" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2.2" clip-path="url(#ground)"/>
      <path d="${path}" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2.2" clip-path="url(#sky)"/>
      <line x1="0" y1="${horizon}" x2="${W}" y2="${horizon}" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
      ${sy < horizon ? `<circle cx="${sx}" cy="${sy}" r="11" fill="url(#glow)"/>` : ''}
      <circle cx="${sx}" cy="${sy}" r="4.5" fill="${sy < horizon ? '#fff' : 'rgba(255,255,255,.45)'}"/>
    </svg>
    <span class="sunfoot">${isDay ? 'Sunrise' : 'Sunset'}: ${clock(other)}<span class="muted"> · ${isDay ? 'sunset' : 'sunrise'} in ${mins >= 90 ? Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm' : mins + ' min'}</span></span>
  </div>`;
}
// WMO weather codes as one symbol each (Open-Meteo's codes).
function wx(code, day = true) {
  if (code === 0) return day ? '☀️' : '🌙';
  if (code <= 2) return day ? '🌤️' : '☁️';
  if (code === 3) return '☁️';
  if (code <= 48) return '🌫️';
  if (code <= 57) return '🌦️';
  if (code <= 67 || (code >= 80 && code <= 82)) return '🌧️';
  if (code <= 77 || code === 85 || code === 86) return '❄️';
  return '⛈️';
}
const clock = t => { const d = new Date(t); return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(':00', '').replace(' ', '').toLowerCase(); };
function fillDash() {
  const d = dash || {};
  // Today: what to resume, then the music playing for the room.
  const today = [];
  if (d.recent) today.push(`<div class="media glass"><img class="mposter" src="${esc(d.recent.poster)}" alt="">
      <div class="two-line" style="flex:1 1 auto"><span class="eyebrow">Up next</span><b class="mtitle">${esc(d.recent.title)}</b><small>${d.recent.app ? 'Resume on ' + esc(d.recent.app) : 'Pick up where you left off'}</small></div>
      <button class="round solid" id="dresume" aria-label="Play ${esc(d.recent.title)} on the TV" style="width:48px;height:48px">${svg('play', 20, 2, 'currentColor')}</button></div>`);
  if (d.music) today.push(`<button class="media glass" id="dmusic" style="width:100%;text-align:left">${d.music.art ? `<img class="mart" src="${esc(d.music.art)}" alt="">` : `<span class="mart" style="display:grid;place-items:center">${svg('music', 24)}</span>`}
      <div class="two-line" style="flex:1 1 auto"><span class="eyebrow" style="color:var(--green)">Playing for the room</span><b class="mtitle">${esc(d.music.title)}</b>
      <small>${esc(d.music.artist)} · ${d.music.next ? d.music.next + ' up next' : 'added by ' + esc(d.music.by)}</small></div><span class="muted">›</span></button>`);
  $('#dtoday').innerHTML = today.length ? `<div class="section"><span class="eyebrow">Today</span><div class="stack">${today.join('')}</div></div>` : '';
  if ($('#dresume')) $('#dresume').onclick = () => playId(d.recent.id);
  if ($('#dmusic')) $('#dmusic').onclick = () => { tick(); go('party'); };

  // The weather: now, then the next six hours.
  const w = d.weather;
  $('#dweather').innerHTML = w && w.temp !== undefined ? `<div class="wcard glass">
      <div class="wnow"><div><span class="label">${esc(w.city || 'Weather')}</span><div class="wtemp">${w.temp}°</div></div>
        <div style="text-align:right"><div style="font-size:30px">${wx(w.code, w.day)}</div><small class="muted">${esc(w.text || '')}${w.hi !== undefined ? `<br>H ${w.hi}°  L ${w.lo}°` : ''}</small></div></div>

  if (pad) {
    // Like a trackpad: every STEP points the finger travels is one move; a touch that never travels selects.
    const STEP = 44, ring = $('#ring');
    let x0, y0, moved;
    const lit = cls => { const c = cls ? pad.querySelector('.chev.' + cls) : ring; c.classList.add('lit'); setTimeout(() => c.classList.remove('lit'), 140); };
    pad.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; moved = false; pad.setPointerCapture(e.pointerId); });
    pad.addEventListener('pointermove', e => {
      if (x0 === undefined) return;

      moved = true; x0 = e.clientX; y0 = e.clientY;

        <button class="round glass" data-n="previous" aria-label="Previous">${svg('prev', 20)}</button>
        <button class="round glass" data-n="back10" aria-label="Back ten seconds">${svg('r10', 20)}</button>

        <button class="round glass" data-n="next" aria-label="Next">${svg('next', 20)}</button></div>`;
    box.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { tick(); api('/api/remote', { key: b.dataset.n }).then(showNow).catch(e => toast(e.message)); });
    if (n.art) backdrop('/api/now/art?t=' + encodeURIComponent(n.title));
  };

}

// More than one app has it: ask which one, in a sheet over the page. Resolves with the chosen entry, or null.

// ---- the swipe deck --------------------------------------------------------------------------------------
// Learning what you like: the first cards come from random genres. Each like adds to that title's genres, each skip
// takes a little away. Once a few likes are in, about half the cards come from the genres you like (weighted by
// how much), and half from any genre, so the deck keeps showing new kinds of things.
// In a watch-together group (deck.group set) the cards come from the TV's shared deck instead, and each swipe is
// a vote there; nothing is learned or saved to picks, and there's no undo.
const deck = {
  queue: [], top: null, history: [], loading: false, genres: [], group: null,
  profile() { try { return JSON.parse(localStorage.getItem('tvhome-taste') || '{}'); } catch (e) { return {}; } },
  store(p) { try { localStorage.setItem('tvhome-taste', JSON.stringify(p)); } catch (e) {} },
  pickGenre() {
    const p = this.profile(), score = p.score || {}, all = this.genres.length ? this.genres.map(g => g[0]) : ['act','ani','cmy','crm','doc','drm','fnt','hrr','fml','trl','rma','scf'];
    const liked = Object.entries(score).filter(([, v]) => v > 0);
    const likes = liked.reduce((a, [, v]) => a + v, 0);
    if (likes >= 3 && Math.random() < 0.5) {
      let r = Math.random() * likes;
      for (const [g, v] of liked) { r -= v; if (r <= 0) return g; }
    }
    return all[Math.floor(Math.random() * all.length)];
  },
  async fill() {
    if (this.group) return;
    if (this.loading) return;
    this.loading = true;
    const p = this.profile(); p.offsets = p.offsets || {}; p.seen = p.seen || [];
    try {
      for (let tries = 0; tries < 3 && this.queue.length < 6; tries++) {
        const g = this.pickGenre(), offset = p.offsets[g] || Math.floor(Math.random() * 3) * 12;
        const r = await api('/api/watch/discover', { genre: g, offset });
        if (r.genres) this.genres = r.genres;
        p.offsets[g] = offset + 12;
        const fresh = (r.cards || []).filter(c => !p.seen.includes(c.key) && !this.queue.some(q => q.key === c.key));
        // Shuffle a little so one genre's batch doesn't arrive in popularity order.
        fresh.sort(() => Math.random() - .5).slice(0, 5).forEach(c => { c.from = g; this.queue.push(c); });
        if (r.error && !r.cards.length) { this.msg(r.error); break; }
      }
      this.store(p);
    } catch (e) { if (!this.top) this.msg(e.message); }
    this.loading = false;
    if (!this.top) this.next();
  },
  msg(t) { const d = $('#deck'); if (d) d.innerHTML = `<div class="deck-msg glass">${esc(t)}</div>`; },
  start() {
    this.top = null;
    const d = $('#deck'); if (!d) return;
    $('#dno').onclick = () => this.fling(-1);
    $('#dyes').onclick = () => this.fling(1);
    if ($('#dundo')) $('#dundo').onclick = () => this.undo();
    if ($('#dplay')) $('#dplay').onclick = () => { if (this.top) playWhere(this.top.title, this.top.where); };
    if (this.queue.length) this.next(); else this.fill();
  },
  /** Group mode: the shared deck's cards this phone hasn't swiped, in the group's order. */
  startGroup(me, cards) {
    this.group = { me }; this.queue = cards.slice(); this.history = []; this.top = null; this.start();
  },
  leaveGroup() { this.group = null; this.queue = []; this.top = null; },
  // A group's cards arrive without the genre list (that comes with a solo deck's first page): fall back to these.
  name(g) { const f = this.genres.find(x => x[0] === g); return f ? f[1] : ({ act: 'Action', ani: 'Animation', cmy: 'Comedy', crm: 'Crime', doc: 'Documentary',
    drm: 'Drama', fnt: 'Fantasy', hst: 'History', hrr: 'Horror', fml: 'Family', msc: 'Music', trl: 'Thriller', rma: 'Romance', scf: 'Sci-fi',
    spt: 'Sport', war: 'War', rly: 'Reality', eur: 'Made in Europe', wsn: 'Western' })[g] || g; },
  next() {
    const d = $('#deck'); if (!d) return;
    this.top = this.queue.shift() || null;
    if (this.queue.length < 4) this.fill();
    if (!this.top) { if (this.group) this.msg('You’ve swiped them all. Waiting for the others…'); else if (!this.loading) this.msg('No more for now. Try a search.'); return; }
    d.innerHTML = '';
    const under = this.queue[0];
    if (under) d.appendChild(this.cardEl(under, true));
    d.appendChild(this.cardEl(this.top, false));
  },
  cardEl(c, back) {
    const el = document.createElement('div');
    el.className = 'card'; el.style.backgroundImage = `url("${c.poster}")`;
    if (back) { el.style.transform = 'scale(.94) translateY(10px)'; el.style.opacity = '.7'; }
    el.innerHTML = `<div class="shade"></div><span class="stamp like">LIKE</span><span class="stamp nope">NOPE</span>
      <div class="meta"><div class="tags">${c.genres.slice(0, 3).map(g => `<span>${esc(this.name(g))}</span>`).join('')}</div>
      <b>${esc(c.title)}</b><small>${esc(c.type)}${c.year ? ' · ' + c.year : ''} · ${esc(c.where.map(w => w.name).join(', '))}</small></div>`;
    if (!back) this.drag(el);
    return el;
  },
  drag(el) {
    let x0 = null, y0 = 0, dx = 0, t0 = 0, sideways = null;
    const like = el.querySelector('.like'), nope = el.querySelector('.nope'), under = el.previousElementSibling;
    el.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; dx = 0; t0 = e.timeStamp; sideways = null; });
    el.addEventListener('pointermove', e => {
      if (x0 === null) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      // Decide in the first few points: sideways drags the card, up and down scrolls the page.
      if (sideways === null && Math.max(Math.abs(mx), Math.abs(my)) > 8) { sideways = Math.abs(mx) > Math.abs(my); if (sideways) { el.setPointerCapture(e.pointerId); el.classList.add('drag'); } }
      if (!sideways) return;
      dx = mx;
      const w = el.offsetWidth, k = Math.min(1, Math.abs(dx) / (w * .4));
      el.style.transform = `translateX(${dx}px) rotate(${dx / w * 14}deg)`;
      (dx > 0 ? like : nope).style.opacity = k; (dx > 0 ? nope : like).style.opacity = 0;
      if (under) { under.style.transition = 'none'; under.style.transform = `scale(${.94 + .06 * k}) translateY(${10 - 10 * k}px)`; under.style.opacity = .7 + .3 * k; }
    });
    const up = e => {
      if (x0 === null) return; x0 = null;
      if (sideways === null && e.type === 'pointerup' && this.top && !this.group) { playWhere(this.top.title, this.top.where); return; }
      if (!sideways) return;
      el.classList.remove('drag');
      const v = Math.abs(dx) / Math.max(1, e.timeStamp - t0);
      if (Math.abs(dx) > el.offsetWidth * .3 || v > .6) this.fling(Math.sign(dx) || 1);
      else { el.style.transform = ''; like.style.opacity = 0; nope.style.opacity = 0;
        if (under) { under.style.transition = ''; under.style.transform = 'scale(.94) translateY(10px)'; under.style.opacity = '.7'; } }
    };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  },
  fling(dir) {
    const c = this.top, d = $('#deck'); if (!c || !d) return;
    tick();
    const el = d.lastElementChild;
    el.classList.remove('drag');
    el.style.transform = `translateX(${dir * window.innerWidth * 1.2}px) rotate(${dir * 24}deg)`;
    el.style.opacity = '0';
    if (this.group) {
      api('/api/group/vote', { me: this.group.me, key: c.key, like: dir > 0 }).then(groupState).catch(e => toast(e.message));
      setTimeout(() => this.next(), 220);
      return;
    }
    const p = this.profile(); p.score = p.score || {}; p.seen = p.seen || [];
    c.genres.forEach(g => { p.score[g] = (p.score[g] || 0) + (dir > 0 ? 1 : -.34); });
    if (dir > 0 && c.from) p.score[c.from] = (p.score[c.from] || 0) + .5;
    p.seen = [c.key, ...p.seen].slice(0, 600);
    this.store(p);
    if (dir > 0) {
      const picks = loadPicks().filter(x => x.title !== c.title);
      picks.unshift({ title: c.title, poster: c.poster, app: c.where.map(w => w.name).join(' · '), where: c.where });
      savePicks(picks); showPicks();
    }
    this.history.push({ card: c, dir });
    setTimeout(() => this.next(), 220);
  },
  undo() {
    const h = this.history.pop(); if (!h) return;
    tick();
    const p = this.profile();
    h.card.genres.forEach(g => { p.score[g] = (p.score[g] || 0) - (h.dir > 0 ? 1 : -.34); });
    if (h.dir > 0 && h.card.from) p.score[h.card.from] -= .5;
    p.seen = (p.seen || []).filter(k => k !== h.card.key);
    this.store(p);
    if (h.dir > 0) { savePicks(loadPicks().filter(x => x.title !== h.card.title)); showPicks(); }
    if (this.top) this.queue.unshift(this.top);
    this.queue.unshift(h.card); this.next();
  },
};

// ---- watch together: one deck for the room, a match when everyone likes the same title -------------------------
// The TV keeps the group (Together.java). This phone remembers which member it is, so a reload rejoins as itself.
let groupMe = (() => { try { return JSON.parse(localStorage.getItem('tvhome-group') || '{}'); } catch (e) { return {}; } })();
let matchShown = '';
function saveGroupMe(g) { groupMe = g; try { localStorage.setItem('tvhome-group', JSON.stringify(g)); } catch (e) {} }
async function togetherView() {
  app.innerHTML = `<button class="link" id="gback" style="display:flex;align-items:center;gap:2px;margin-left:-6px">${svg('back', 20, 2.2)}Watch</button>

  $('#gback').onclick = () => go('watch');
  let s;

  const people = s.active ? s.members.map(m => m.name) : [];
  $('#gbody').innerHTML = `
    <p class="sub" style="margin-top:4px">Everyone opens this page on their own phone and swipes the same shows. When you all like one, it’s a match and the TV shows it with a Play button.</p>

  actions(s.active ? `<button class="btn solid" id="gjoin">Join ${people.length === 1 ? esc(people[0]) : 'the group'}</button>

    : `<button class="btn solid" id="gnew">Start a group</button>`);

function groupDeck(s) {
  $('#gbody').innerHTML = `<div class="members" id="gmembers"></div>
    <div class="deck" id="deck"><div class="deck-msg glass">Loading the shows…</div></div>

// Called with every answer from the TV: who's in, how far each has got, the room's favourites, and a match.
function groupState(s) {
  if (page !== 'together') return;
  if (!s.active || s.gone || s.joined === false) { clearInterval(nowTimer); saveGroupMe({}); deck.leaveGroup(); toast('The group has ended'); return togetherView(); }
  const m = $('#gmembers');
  if (m) m.innerHTML = s.members.map(x => `<span class="member glass ${x.you ? 'you' : ''}"><b>${esc(x.you ? 'You' : x.name)}</b><small>${x.swiped}/${s.total}</small></span>`).join('')
    + (s.members.length < 2 ? `<span class="muted" style="font-size:13px;align-self:center">Waiting for someone to join…</span>` : '');
  const top = (s.top || []).filter(t => t.likes >= 1);
  const sec = $('#gtopsec');
  if (sec) { sec.hidden = !top.length || !!s.match;
    $('#gtop').innerHTML = top.map(t => `<div class="row" style="justify-content:flex-start;gap:12px"><img class="icon" style="width:36px;height:54px;border-radius:6px" src="${esc(t.poster)}" alt="">
      <span class="two-line" style="flex:1 1 auto"><span>${esc(t.title)}</span><small>${t.likes} of ${s.members.length} like it</small></span>
      <button class="acct-btn" data-gplay="${esc(t.key)}">Play</button></div>`).join('');
    $('#gtop').querySelectorAll('[data-gplay]').forEach(b => b.onclick = () => groupPlay(b.dataset.gplay)); }
  if (s.match && matchShown !== s.match.key) { matchShown = s.match.key; matchSheet(s.match); }
}
async function groupPlay(key) {
  tick();
  try { const r = await api('/api/group/play', { key }); toast(r.error || r.note || 'Playing on the TV'); if (!r.error) { saveGroupMe({}); deck.leaveGroup(); clearInterval(nowTimer); go('remote'); } }
  catch (e) { toast(e.message); }
}
function matchSheet(t) {
  if (navigator.vibrate) navigator.vibrate([20, 60, 30]); else tick();
  const scrim = document.createElement('div'), sheet = document.createElement('div');
  scrim.className = 'scrim'; sheet.className = 'sheet glass match'; sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-label', 'It’s a match');
  sheet.innerHTML = `<img src="${esc(t.poster)}" alt=""><span class="eyebrow" style="color:#ff6b8a">It’s a match!</span>
    <h2>${esc(t.title)}</h2><p>Everyone liked it. It’s on the TV now.</p>
    <button class="btn solid" id="mplay">${svg('play', 20, 2, 'currentColor')}Play on the TV</button>
    <button class="btn glass" id="magain" style="min-height:50px">Keep swiping</button>`;
  document.body.append(scrim, sheet);
  requestAnimationFrame(() => { scrim.classList.add('on'); sheet.classList.add('on'); });
  const close = () => { scrim.classList.remove('on'); sheet.classList.remove('on'); setTimeout(() => { scrim.remove(); sheet.remove(); }, 350); };
  $('#mplay').onclick = () => { close(); groupPlay(t.key); };
  $('#magain').onclick = async () => { close(); try { groupState(await api('/api/group/again', { me: groupMe.me })); } catch (e) {} matchShown = ''; };
  scrim.onclick = close;
}

    : `<div class="stay-card glass"><span class="eyebrow">No one staying</span><div class="muted" style="font-size:15px">${g.names ? `Next: ${esc(g.names)} from ${esc(g.arrive)}` : 'Add a stay so the TV greets your guests by name.'}</div></div>`}
    <div class="section"><span class="eyebrow">The TV</span><div class="list glass">
      <div style="padding:12px 0"><div class="seg" role="group" aria-label="TV mode" style="background:rgba(255,255,255,.1)">
        <button data-mode="home" class="${h.mode === 'home' ? 'on' : ''}">Home</button><button data-mode="guest" class="${h.mode !== 'home' && h.mode !== 'kids' ? 'on' : ''}">Guest</button><button data-mode="kids" class="${h.mode === 'kids' ? 'on' : ''}">Kids</button></div></div>
      ${toggleRow('locked', 'Lock to Guest mode', 'Leaving it on the TV needs your PIN', h.locked)}
      ${toggleRow('gremote', 'Guest remote', 'Guests control the TV from their phone', h.guest_remote !== false)}
    </div></div>
    <div class="section"><button class="btn glass" id="newstay">${svg('plus', 20, 2.2)}New stay</button></div>`;
  if ($('#edit')) $('#edit').onclick = () => { hostTab = 'stay'; hostView(); };
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => save({ mode: b.dataset.mode }, 'TV is in ' + b.textContent + ' mode').then(hostView));
  $('#locked').onchange = e => save({ locked: e.target.checked }, e.target.checked ? 'Locked to Guest mode' : 'Unlocked');
  $('#gremote').onchange = e => save({ guest_remote: e.target.checked }, e.target.checked ? 'Guest remote on' : 'Guest remote off');
  $('#newstay').onclick = () => { hostTab = 'stay'; stayView(head, true); bindHead(); };
}
function bindHead() { document.querySelectorAll('[data-ht]').forEach(b => { b.classList.toggle('on', b.dataset.ht === hostTab); b.onclick = () => { tick(); hostTab = b.dataset.ht; actions(null); hostView(); }; }); }
function stayView(head, fresh) {
  const g = fresh ? {} : (host.guest || {});
  const today = new Date().toISOString().slice(0, 10);
  app.innerHTML = head + `<h1 style="margin-top:14px">${fresh || !g.names ? 'New stay' : 'Current stay'}</h1>
    <div class="section"><span class="eyebrow">Guests</span><div class="list glass">
      <label class="row"><span>Names</span><input id="names" placeholder="e.g. Sarah and Tom" value="${esc(g.names)}"></label></div>
      <div class="note">The TV greets them by name.</div></div>
    <div class="section"><span class="eyebrow">Dates</span><div class="list glass">
      <label class="row"><span>Arrive</span><input id="arrive" type="date" value="${esc(g.arrive || today)}"></label>
      <label class="row"><span>Depart</span><input id="depart" type="date" value="${esc(g.depart || '')}"></label></div></div>
    <div class="section"><span class="eyebrow">Door code</span><div class="list glass">
      <label class="row"><span>Code</span><input id="door" inputmode="numeric" value="${esc(fresh ? '' : host.door_code)}" style="font-weight:600;letter-spacing:.1em"></label></div>
      <div class="note">Only shown from the arrive date until an hour after check-out. Between stays the TV shows no names and no code.</div></div>
    ${g.names ? `<div class="section"><button class="btn glass red" id="end">End this stay now</button></div>` : ''}
    <p class="err" id="err"></p>`;
  actions(`<button class="btn solid" id="savestay">Save stay</button>`);
  $('#savestay').onclick = async () => {
    const names = $('#names').value.trim(), arrive = $('#arrive').value, depart = $('#depart').value;
    if (!names) return $('#err').textContent = 'Add your guests’ names.';
    if (!depart) return $('#err').textContent = 'Add the depart date.';
    if (depart < arrive) return $('#err').textContent = 'Depart must be after arrive.';
    if (await save({ guest: { names, arrive, depart }, door_code: $('#door').value.trim() }, 'Stay saved')) { hostTab = 'today'; actions(null); hostView(); }
  };
  if ($('#end')) $('#end').onclick = async () => { if (confirm('End this stay now? The TV stops showing their names and the door code.')) { if (await save({ guest: null, door_code: '' }, 'Stay ended')) { hostTab = 'today'; actions(null); hostView(); } } };
}
function placeView(head) {
  const h = host;
  let rules = [...(h.rules || [])];
  const render = () => {
    app.innerHTML = head + `<h1 style="margin-top:14px">Your place</h1>
      <div class="section"><div class="list glass">
        <label class="row"><span>Name</span><input id="place" value="${esc(h.place)}" placeholder="e.g. The Ridge"></label>
        <label class="row"><span>About</span><input id="about" value="${esc(h.about)}" placeholder="Shown between stays"></label></div></div>
      <div class="section"><span class="eyebrow">Wi-Fi and times</span><div class="list glass">
        <label class="row"><span>Network</span><input id="wifi" value="${esc(h.wifi_name)}"></label>
        <label class="row"><span>Password</span><input id="wifipw" value="${esc(h.wifi_password)}"></label>
        <label class="row"><span>Check-in from</span><input id="cin" type="time" value="${esc(h.checkin || '15:00')}"></label>
        <label class="row"><span>Check-out by</span><input id="cout" type="time" value="${esc(h.checkout || '10:00')}"></label></div></div>
      <div class="section"><div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px">
        <span class="eyebrow">House rules</span><button class="link" id="add">Add rule</button></div>
        <div class="list glass">${rules.length ? rules.map((r, i) => `<div class="row" style="gap:12px">
          <button class="rule-x" data-del="${i}" aria-label="Remove rule">−</button>
          <input data-rule="${i}" value="${esc(r)}" style="text-align:left" aria-label="Rule ${i + 1}">
          <button class="move" data-up="${i}" aria-label="Move up" ${i ? '' : 'disabled'}>${svg('chev', 18, 2.2)}</button></div>`).join('')
          : `<div class="row muted">No rules yet</div>`}</div></div>`;
    bindHead();
    actions(`<button class="btn solid" id="saveplace">Save</button>`);
    const sync = () => document.querySelectorAll('[data-rule]').forEach(i => rules[+i.dataset.rule] = i.value);
    const keep = () => { h.place = $('#place').value; h.about = $('#about').value; h.wifi_name = $('#wifi').value; h.wifi_password = $('#wifipw').value; h.checkin = $('#cin').value; h.checkout = $('#cout').value; };
    $('#add').onclick = () => { sync(); keep(); rules.push(''); render(); document.querySelector(`[data-rule="${rules.length - 1}"]`).focus(); };
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { sync(); keep(); rules.splice(+b.dataset.del, 1); render(); });
    document.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { sync(); keep(); const i = +b.dataset.up; [rules[i - 1], rules[i]] = [rules[i], rules[i - 1]]; render(); });
    $('#saveplace').onclick = () => { sync(); save({ place: $('#place').value, about: $('#about').value, wifi_name: $('#wifi').value,
      wifi_password: $('#wifipw').value, checkin: $('#cin').value || '15:00', checkout: $('#cout').value || '10:00',
      rules: rules.map(r => r.trim()).filter(Boolean) }); };
  };
  render();
}
function settingsView(head) {
  const h = host, allowed = new Set(h.apps || []), kidApps = new Set(h.kids_apps || []);
  app.innerHTML = head + `<h1 style="margin-top:14px">Settings</h1>
    <div class="section"><span class="eyebrow">Apps guests can open</span><div class="list glass">
      ${apps.map(a => `<label class="row" style="justify-content:flex-start;gap:12px"><img class="icon" src="/api/icon?pkg=${encodeURIComponent(a.pkg)}" alt="">
        <span style="flex:1 1 auto;min-width:0">${esc(a.label)}</span><span class="switch"><input type="checkbox" data-app="${esc(a.pkg)}" ${allowed.has(a.pkg) ? 'checked' : ''} role="switch" aria-label="${esc(a.label)}"><i></i></span></label>`).join('')}
    </div><div class="note">Only these appear on the welcome screen and the guest remote.</div></div>
    <div class="section"><span class="eyebrow">Kids mode</span><div class="list glass">
      <label class="row"><span>Child’s name</span><input id="kidname" value="${esc(h.kids_name)}" placeholder="Optional"></label>
      ${(h.kids_shows || []).map((k, i) => `<div class="row" style="justify-content:flex-start;gap:12px"><button class="rule-x" data-kidx="${i}" aria-label="Remove ${esc(k.title)}">−</button><span>${esc(k.title)}</span></div>`).join('') || '<div class="row muted">No shows yet</div>'}
    </div><div class="note">Add shows from Watch: search, then tap Add to Kids. Switch the TV to Kids on Today; leaving Kids mode on the TV needs your PIN.</div>
      <div class="chips" style="padding:10px 0 0">${apps.map(a => `<button data-kapp="${esc(a.pkg)}" class="${kidApps.has(a.pkg) ? 'on' : ''}" aria-pressed="${kidApps.has(a.pkg)}">${esc(a.label)}</button>`).join('')}</div>
      <div class="note">Blue apps show on the Kids screen.</div></div>
    <div class="section"><span class="eyebrow">Guest accounts</span><div class="list glass">
      ${toggleRow('autoout', 'Sign guests out after check-out', 'An hour after check-out, apps they signed in to from their phone are cleared', h.auto_signout !== false)}
    </div><div class="note">Clearing an app signs out everyone on it, you included, so keep your own accounts off the apps guests sign in to.</div></div>
    <div class="section"><span class="eyebrow">Ask about the area</span><div class="list glass">
      <div class="row"><span>AI answers</span><span class="v" style="color:${h.ai_configured ? 'var(--green)' : 'var(--ink-3)'}">${h.ai_configured ? 'On' : 'Off'}</span></div>
      <label class="row"><span>Groq API key</span><input id="aikey" type="password" placeholder="${h.ai_configured ? 'Saved · paste to replace' : 'gsk_…'}" autocomplete="off"></label>
      ${h.ai_configured ? `<div class="row"><button class="link" id="aiclear" style="color:var(--red)">Remove key</button></div>` : ''}
    </div><div class="note">Guests can ask for dinner spots and things to do. The key stays on the TV and is never shown again.</div></div>
    <div class="section"><span class="eyebrow">Arrival show</span><div class="list glass">
      ${toggleRow('arrival', 'Welcome on the TV', 'When a guest first opens this page on check-in day, the TV plays a short welcome with their names, Wi-Fi and the house guide', h.arrival_show !== false)}
      <div class="row"><button class="link" id="arrivalplay">Play it on the TV now</button></div>
    </div><div class="note">It uses the TV’s wallpapers as pictures of the place.</div></div>
    <div class="section"><span class="eyebrow">Security</span><div class="list glass">
      <label class="row"><span>New PIN</span><input id="newpin" type="password" inputmode="numeric" maxlength="8" placeholder="4 to 8 digits"></label>
      <div class="row"><button class="link" id="setpin">Change PIN</button></div></div></div>
    <div class="section"><span class="eyebrow">This TV</span><div class="list glass">
      <div class="row"><span>Address</span><span class="muted">${esc(location.host)}</span></div></div></div>
    <div class="section"><button class="btn glass red" id="signout">Sign out</button></div>`;
  document.querySelectorAll('[data-app]').forEach(i => i.onchange = () => save({ apps: [...document.querySelectorAll('[data-app]:checked')].map(x => x.dataset.app) }, 'Apps updated'));
  $('#autoout').onchange = e => save({ auto_signout: e.target.checked }, e.target.checked ? 'Guests are signed out after check-out' : 'Automatic sign-out off');
  $('#kidname').onchange = e => save({ kids_name: e.target.value }, 'Saved');
  document.querySelectorAll('[data-kidx]').forEach(b => b.onclick = async () => { try { await api('/api/kids/remove', { index: +b.dataset.kidx }); hostView(); } catch (e) { toast(e.message); } });
  document.querySelectorAll('[data-kapp]').forEach(b => b.onclick = () => { b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on'));
    save({ kids_apps: [...document.querySelectorAll('[data-kapp].on')].map(x => x.dataset.kapp) }, 'Kids apps updated'); });
  $('#aikey').onchange = async e => { const k = e.target.value.trim(); if (!k) return; if (await save({ ai_key: k }, 'AI answers on')) hostView(); };
  if ($('#aiclear')) $('#aiclear').onclick = async () => { if (await save({ ai_key_clear: true }, 'AI answers off')) hostView(); };
  $('#arrival').onchange = e => save({ arrival_show: e.target.checked }, e.target.checked ? 'Arrival show on' : 'Arrival show off');
  $('#arrivalplay').onclick = () => { tick(); api('/api/arrival/play', {}).then(() => toast('Playing on the TV')).catch(e => toast(e.message)); };
  $('#setpin').onclick = async () => { try { await api('/api/pin', { pin: $('#newpin').value.trim() }); $('#newpin').value = ''; toast('PIN changed'); } catch (e) { toast(e.message); } };
  $('#signout').onclick = () => { session = ''; localStorage.removeItem('tvhome-session'); page = ''; load(); };
}

load();
</script>
</body>
</html>
