plugins {
    id 'com.android.application'
}

// Release key for published APKs (GitHub Releases, Orion Store). It never lives in this repo: the path and password
// come from ~/.android-keys/tvhome-release.properties, or the same names as environment variables. Without them
// the release build falls back to the debug key, as before.
def releaseKey = new Properties()
def releaseKeyFile = new File(System.getProperty('user.home'), '.android-keys/tvhome-release.properties')
if (releaseKeyFile.exists()) releaseKeyFile.withInputStream { releaseKey.load(it) }
def keyValue = { String name -> System.getenv(name) ?: releaseKey.getProperty(name) }

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.0.1'
    }

    signingConfigs {
        if (keyValue('TVHOME_KEYSTORE')) {
            release {
                storeFile file(keyValue('TVHOME_KEYSTORE'))
                storePassword keyValue('TVHOME_KEYSTORE_PASSWORD')
                keyAlias keyValue('TVHOME_KEY_ALIAS') ?: 'tvhome'
                keyPassword keyValue('TVHOME_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // The release key when this machine has it (published builds), else the debug key (local sideloads).
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The default theme and the tested clean-up lists travel inside the APK, for setup without a computer (Setup).
tasks.register('bundleTheme', Copy) {
    from('../../themes/ian-dusk') { include 'config.json', 'wallpapers/**', 'depth/**' }
    from('../..') { include 'debloat/tcl-g10-google-tv.txt' }
    into layout.buildDirectory.dir('bundled')
}
android.sourceSets.main.assets.srcDirs += layout.buildDirectory.dir('bundled').get().asFile
preBuild.dependsOn 'bundleTheme'

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
