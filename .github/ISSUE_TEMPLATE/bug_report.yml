name: Bug report
description: Something on the TV or the phone page doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. For security problems, use a private report instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV brand and model
      placeholder: e.g. TCL G10 (adb shell getprop ro.product.model)
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and firmware
      placeholder: e.g. Android 12, STT2.230203.001
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. v1.0.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Setup / welcome steps
        - Home screen (clock, dock, wallpapers)
        - Control Center
        - Now Playing / StandBy / lyrics
        - Guest mode on the TV
        - Phone page (host or guest)
        - Debloat list
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: A TV screenshot (adb exec-out screencap -p > shot.png) or adb logcat lines. Remove Wi-Fi passwords, door codes and names first.
  - type: checkboxes
    id: restart
    attributes:
      label: Restart check
      options:
        - label: The problem is still there after a full restart of the TV.
