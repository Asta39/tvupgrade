name: Feature request
description: Suggest something new for the home screen, Guest mode or the phone page.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the moment it would help, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Sketches, screenshots from other TVs or apps, and how it should feel with a TV remote.
  - type: dropdown
    id: mode
    attributes:
      label: Home mode, Guest mode or both?
      options: [Home mode, Guest mode, Both]
