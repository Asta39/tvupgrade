<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* The project website's look: white and #f5f5f7, ink #1d1d1f, Apple blue, the warm gradient eyebrow. */
  :root { --bg: #fff; --alt: #f5f5f7; --ink: #1d1d1f; --muted: #6e6e73; --blue: #0071e3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body { font-family: Inter, -apple-system, "SF Pro Display", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .slide { position: relative; width: var(--w); height: var(--h); display: flex; flex-direction: column; padding: var(--pad) var(--pad) 0; background: var(--bg); overflow: hidden; }
  .slide.alt { background: var(--alt); }
  .slide.dark { background: #000; color: #f5f5f7; }
  .slide.dark .lead { color: #a1a1a6; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 600; color: var(--muted); }
  .brand { display: flex; align-items: center; gap: 14px; color: var(--ink); font-size: 28px; }
  .dark .brand { color: #f5f5f7; }
  .brand img { width: 46px; height: 46px; border-radius: 12px; }
  .eyebrow { margin-top: var(--gap); font-size: 34px; font-weight: 700; background: linear-gradient(90deg,#ff9500,#ff2d55,#af52de);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { font-size: var(--h1); font-weight: 800; letter-spacing: -.045em; line-height: 1.0; margin-top: 14px; }
  .lead { font-size: var(--lead); line-height: 1.32; color: var(--muted); font-weight: 500; letter-spacing: -.01em; margin-top: 24px; max-width: 900px; }
  .lead b { color: var(--ink); font-weight: 600; }
  .dark .lead b { color: #fff; }
  .art { flex: 1 1 auto; position: relative; display: flex; align-items: center; justify-content: center; margin-top: 40px; min-height: 0; }
  .tv { width: calc(100% + 2 * var(--pad) * .35); border-radius: 28px; overflow: hidden; box-shadow: 0 40px 90px -36px rgba(0,0,0,.5); }
  .tv img { width: 100%; display: block; }
  .phones { display: flex; gap: 28px; align-items: flex-end; justify-content: center; }
  /* iPhone 16 Pro Max mockup (Magnific), screenshot already inside it: screenshots/mockup-*.png */
  .phone { width: var(--phone); filter: drop-shadow(0 30px 40px rgba(0,0,0,.18)); }
  .phone img { width: 100%; display: block; }
  .phone.small { width: calc(var(--phone) * .86); transform: translateY(-30px) rotate(-3deg); }
  .combo { position: relative; width: 100%; }
  .combo .tv { width: 100%; }
  .combo .phone { position: absolute; right: -40px; bottom: -70px; width: calc(var(--phone) * .62); }
  .pills { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 30px; }
  .chip { font-size: 26px; font-weight: 600; padding: 12px 24px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .alt .chip { background: #fff; }
  .foot { display: flex; justify-content: space-between; align-items: center; padding: 34px 0 calc(var(--pad) * .7); font-size: 26px; color: var(--muted); font-weight: 500; }
  .swipe { display: inline-flex; align-items: center; gap: 12px; color: var(--blue); font-weight: 600; }
  .swipe svg { width: 34px; height: 34px; }
  .btn { white-space: nowrap; display: inline-flex; align-items: center; gap: 14px; background: var(--blue); color: #fff; font-size: 34px; font-weight: 600; padding: 24px 44px; border-radius: 999px; }
  .btn svg { width: 38px; height: 38px; }
  .cta { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .cta .lead { margin-left: auto; margin-right: auto; }
  .cta .icon { width: 190px; height: 190px; border-radius: 46px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.35); margin-bottom: 50px; }
  .url { font-size: 32px; font-weight: 600; margin-top: 26px; color: var(--ink); }
  .ticks { list-style: none; margin-top: 44px; display: grid; gap: 18px; font-size: 32px; font-weight: 600; text-align: left; }
  .ticks li::before { content: "✓"; color: #30d158; margin-right: 16px; font-weight: 800; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const fmt = q.get('f') === 'tt' ? 'tt' : 'ig', n = +q.get('n') || 1;
// Instagram 4:5 portrait, TikTok 9:16 photo mode.
const F = fmt === 'ig'
  ? { w: 1080, h: 1350, pad: 80, gap: 56, h1: 96, lead: 38, phone: 310 }
  : { w: 1080, h: 1920, pad: 90, gap: 120, h1: 112, lead: 42, phone: 470 };
for (const k in F) document.documentElement.style.setProperty('--' + k, typeof F[k] === 'number' && k !== 'n' ? F[k] + 'px' : F[k]);
const S = '../screenshots/';
const tv = f => `<div class="tv"><img src="${S}${f}"></div>`;
const phone = (f, c = '') => `<div class="phone ${c}"><img src="${S}mockup-${f.replace('.jpg', '.png')}"></div>`;
const arrow = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

const slides = [
  { cls: '', eyebrow: 'For Google TV & Android TV', h: 'Your TV can<br>look like this.', lead: 'A free, Apple TV–style home screen. <b>No root. No new TV.</b>', art: tv('home-3.jpg'), swipe: true },
  { cls: 'dark', eyebrow: 'Liquid-glass clock', h: 'A clock that sits<br>inside the photo.', lead: 'Glass time, cut out behind the mountains, over <b>4K wallpapers</b> that change on their own.', art: tv('glass-clock.jpg') },
  { cls: 'alt', eyebrow: 'StandBy', h: 'Lyrics, in sync,<br>on the big screen.', lead: 'Play a song and the TV turns into a <b>night clock with live lyrics</b>.', art: tv('standby-lyrics.jpg') },
  { cls: '', eyebrow: 'Your phone is the remote', h: 'Scan. Swipe.<br>Type.', lead: 'A trackpad remote, and <b>your phone’s keyboard types on the TV</b>. No app to install.', art: `<div class="phones">${phone('phone-remote.jpg', 'small')}${phone('phone-keyboard.jpg')}</div>` },
  { cls: 'alt', eyebrow: 'Watch together', h: 'Swipe on films.<br>It’s a match.', lead: 'Everyone swipes on their phone. When you all like one, <b>the TV shows it</b>.', art: `<div class="combo">${tv('tv-match.jpg')}${phone('phone-match.jpg')}</div>` },
  { cls: '', eyebrow: 'Party mode', h: 'Everyone<br>queues the music.', lead: 'Swipe songs Tinder-style, and they play <b>in the order you queued them</b>.', art: `<div class="phones">${phone('phone-songs.jpg', 'small')}${phone('phone-music.jpg')}</div>` },
  { cls: 'alt', eyebrow: 'Guest mode', h: 'Built for<br>Airbnb hosts.', lead: 'A welcome screen with <b>Wi-Fi, house guide and checkout</b>, and a phone remote for every guest.', art: tv('guest-mode.jpg') },
  { cls: '', cta: true },
];
const total = slides.length, s = slides[Math.min(n, total) - 1];
const header = `<div class="top"><span class="brand"><img src="${S}app-icon.png">Home</span></div>`;
let body;
if (s.cta) {
  body = `<div class="slide">${header}<div class="cta">
    <img class="icon" src="${S}app-icon.png">
    <div class="eyebrow" style="margin-top:0">Free &amp; open source</div>
    <h1>Upgrade your TV<br>tonight.</h1>
    <ul class="ticks"><li>No root, no flashing</li><li>Every change can be undone</li><li>Debloats the ads and trackers</li></ul>
    <div style="margin-top:56px"><span class="btn">Link in bio ${arrow}</span></div>
    <div class="url">asta39.github.io/tvupgrade</div></div>
    <div class="foot"><span>Save this for later</span><span>Send it to someone with a Google TV</span></div></div>`;
} else {
  body = `<div class="slide ${s.cls}">${header}
    <div class="eyebrow">${s.eyebrow}</div><h1>${s.h}</h1><p class="lead">${s.lead}</p>
    <div class="art">${s.art}</div>
    <div class="foot"><span>asta39.github.io/tvupgrade</span>${s.swipe ? `<span class="swipe">Swipe ${arrow}</span>` : ''}</div></div>`;
}
document.getElementById('root').innerHTML = body;
</script>
</body>
</html>
